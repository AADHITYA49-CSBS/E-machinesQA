services:
  - type: web
    name: electramind-ai
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application
    plan: free
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CSRF_TRUSTED_ORIGINS
        value: https://electramind-ai.onrender.com
      - key: USE_SQLITE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: electramind-db
          property: connectionString

databases:
  - name: electramind-db
    plan: free